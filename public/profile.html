<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | InternConnect</title>
    <!-- Use locally-built Tailwind CSS in production. Build with `npm run build:css`. -->
    <link rel="stylesheet" href="tailwind.css?v=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
</head>
<body class="bg-gray-50">

    <div id="page-content" class="min-h-screen flex-col hidden">
        <header class="bg-white/80 backdrop-blur-sm sticky top-0 z-50 border-b">
            <div id="header-content" class="max-w-7xl mx-auto px-4">
                <!-- Dynamic Header will be injected here -->
            </div>
        </header>

        <main class="py-8 px-4">
            <div class="max-w-4xl mx-auto animate-on-scroll animate-fade-in">
                <div class="flex justify-between items-start mb-8">
                    <div>
                        <h1 class="text-4xl font-bold text-foreground mb-2">My Profile</h1>
                        <p class="text-lg text-foreground/70">Manage your personal information and preferences.</p>
                    </div>
                    <div class="flex items-center space-x-3">
                        <a href="student-dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
                        <button id="edit-profile-btn" class="btn btn-secondary flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 mr-2"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"></path></svg>
                            Edit Profile
                        </button>
                        <button id="save-profile-btn" class="btn btn-primary hidden">Save Changes</button>
                    </div>
                </div>

                <div class="grid lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-1">
                        <div class="bg-white rounded-2xl shadow-sm p-6 text-center">
                            <img id="profile-picture" class="w-24 h-24 rounded-full mx-auto mb-4 bg-gray-200" src="https://placehold.co/96x96/E0E7FF/4F46E5?text=IC" alt="Profile Picture">
                            <h2 id="profile-name" class="text-2xl font-bold text-gray-900 mb-1">User Name</h2>
                            <p id="profile-university" class="text-sm text-gray-500 mb-4">University Name</p>
                             <div id="profile-skills" class="flex flex-wrap gap-2 justify-center">
                            </div>
                        </div>
                    </div>

                    <div class="lg:col-span-2 space-y-6">
                        <form id="profile-form">
                            <div class="bg-white rounded-2xl shadow-sm p-6">
                                <h3 class="font-semibold text-xl text-gray-900 mb-4">Personal Information</h3>
                                <div class="space-y-4">
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label for="firstName" class="text-sm font-medium text-gray-700">First Name</label>
                                            <input type="text" id="firstName" class="mt-1 w-full h-10 px-4 border border-gray-300 rounded-xl" disabled>
                                        </div>
                                        <div>
                                            <label for="lastName" class="text-sm font-medium text-gray-700">Last Name</label>
                                            <input type="text" id="lastName" class="mt-1 w-full h-10 px-4 border border-gray-300 rounded-xl" disabled>
                                        </div>
                                    </div>
                                     <div>
                                        <label for="email" class="text-sm font-medium text-gray-700">Email</label>
                                        <input type="email" id="email" class="mt-1 w-full h-10 px-4 border border-gray-300 rounded-xl bg-gray-100" disabled>
                                    </div>
                                </div>
                            </div>
                            
                            <div id="academic-info-card" class="bg-white rounded-2xl shadow-sm p-6 mt-6">
                                <h3 class="font-semibold text-xl text-gray-900 mb-4">Academic Information</h3>
                                <div class="space-y-4">
                                     <div>
                                        <label for="university" class="text-sm font-medium text-gray-700">University</label>
                                        <input type="text" id="university" class="mt-1 w-full h-10 px-4 border border-gray-300 rounded-xl" disabled>
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label for="major" class="text-sm font-medium text-gray-700">Major</label>
                                            <input type="text" id="major" class="mt-1 w-full h-10 px-4 border border-gray-300 rounded-xl" disabled>
                                        </div>
                                        <div>
                                            <label for="graduationYear" class="text-sm font-medium text-gray-700">Graduation Year</label>
                                            <input type="text" id="graduationYear" class="mt-1 w-full h-10 px-4 border border-gray-300 rounded-xl" disabled>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <div id="loader" class="h-screen w-screen flex justify-center items-center">
        <p class="text-gray-500">Loading...</p>
    </div>

    <script type="module" src="auth-header.js" defer></script>
    <script type="module" src="profile.js"></script>
    <script src="animations.js" defer></script>

</body>
</html>
