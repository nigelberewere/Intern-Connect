<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Profile | InternConnect</title>
    <!-- Use locally-built Tailwind CSS in production. Build with `npm run build:css`. -->
    <link rel="stylesheet" href="tailwind.css?v=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="bg-background">
    <!-- Full screen loader -->
    <div id="loader" class="fixed inset-0 bg-background z-50 flex justify-center items-center">
        <div class="loader-spinner"></div>
    </div>

    <div id="page-content" class="min-h-screen flex-col hidden">
        <!-- Header -->
        <header class="bg-white/80 backdrop-blur-sm shadow-sm border-b sticky top-0 z-40">
            <div id="header-content" class="max-w-7xl mx-auto px-4">
                <!-- Dynamic Header will be injected here -->
            </div>
        </header>

        <main class="py-12 px-4 flex-grow">
            <div class="max-w-5xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-start mb-8">
                    <div>
                        <h1 class="text-4xl font-bold text-foreground mb-2">Company Profile</h1>
                        <p class="text-lg text-foreground/70">Keep your company's information up-to-date for potential interns.</p>
                    </div>
                    <div class="flex space-x-2 mt-4 md:mt-0">
                        <a href="company-dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
                         <button id="edit-profile-btn" class="btn btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 mr-2"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"></path></svg>
                            Edit Profile
                        </button>
                         <button id="save-profile-btn" class="btn btn-secondary hidden">Save Changes</button>
                    </div>
                </div>

                <form id="company-profile-form" class="grid md:grid-cols-3 gap-8">
                    <!-- Left Column: Logo & Name -->
                    <div class="md:col-span-1 space-y-6">
                        <div class="card text-center p-6">
                            <img id="company-logo" class="w-24 h-24 rounded-full mx-auto mb-4 bg-gray-200 object-cover" src="https://placehold.co/96x96/E0E7FF/4F46E5?text=Logo" alt="Company Logo">
                             <div class="space-y-2">
                                <label for="logoUrl" class="label">Logo URL</label>
                                <input type="text" id="logoUrl" class="input text-sm" placeholder="https://..." disabled>
                            </div>
                        </div>
                         <div class="card p-6">
                             <div class="space-y-2">
                                <label for="companyName" class="label">Company Name</label>
                                <input type="text" id="companyName" class="input font-semibold" disabled>
                            </div>
                         </div>
                    </div>

                    <!-- Right Column: Details -->
                    <div class="md:col-span-2 card p-8 space-y-6">
                        <h3 class="card-title-sm">Company Details</h3>
                        <div class="grid sm:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label for="industry" class="label">Industry</label>
                                <input type="text" id="industry" class="input" disabled>
                            </div>
                            <div class="space-y-2">
                                <label for="location" class="label">Location</label>
                                <input type="text" id="location" class="input" disabled>
                            </div>
                        </div>
                         <div class="space-y-2">
                            <label for="website" class="label">Website</label>
                            <input type="text" id="website" class="input" placeholder="https://www.yourcompany.com" disabled>
                        </div>
                        <div class="space-y-2">
                            <label for="description" class="label">Company Description</label>
                            <textarea id="description" rows="5" class="input min-h-[120px]" placeholder="A brief summary of what your company does..." disabled></textarea>
                        </div>
                        <div class="space-y-2">
                            <label for="companySize" class="label">Company Size</label>
                            <select id="companySize" class="input" disabled>
                                <option>1-10 employees</option>
                                <option>11-50 employees</option>
                                <option>51-200 employees</option>
                                <option>201-500 employees</option>
                                <option>501-1000 employees</option>
                                <option>1000+ employees</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script type="module" src="auth-header.js" defer></script>
    <script type="module" src="company-profile.js"></script>
</body>
</html>
