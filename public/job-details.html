<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details | InternConnect</title>
    <!-- Use locally-built Tailwind CSS in production. Build with `npm run build:css`. -->
    <link rel="stylesheet" href="tailwind.css?v=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.6">
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="bg-background">
    <!-- Full screen loader -->
    <div id="loader" class="fixed inset-0 bg-background z-50 flex justify-center items-center">
        <div class="loader-spinner"></div>
    </div>

    <div id="page-content" class="min-h-screen flex-col hidden">
        <!-- Header -->
        <header class="bg-white/80 backdrop-blur-sm sticky top-0 z-40 border-b border-slate-200">
            <div id="header-container" class="max-w-7xl mx-auto px-4">
                 <!-- Header will be injected by auth-header.js -->
            </div>
        </header>

        <main class="py-12 px-4 flex-grow">
            <div id="job-details-container" class="max-w-4xl mx-auto">
                <!-- SKELETON LOADER FOR JOB DETAILS -->
                <div id="job-details-skeleton">
                    <div class="shimmer-wrapper h-10 w-3/4 mb-2 rounded-lg"></div>
                    <div class="shimmer-wrapper h-6 w-1/2 mb-6 rounded-md"></div>
                    <div class="space-y-4">
                        <div class="shimmer-wrapper h-5 w-full rounded-md"></div>
                        <div class="shimmer-wrapper h-5 w-full rounded-md"></div>
                        <div class="shimmer-wrapper h-5 w-3/4 rounded-md"></div>
                    </div>
                     <div class="shimmer-wrapper h-12 w-32 mt-8 rounded-lg"></div>
                </div>
                <!-- ACTUAL JOB CONTENT WILL BE INJECTED HERE -->
            </div>
        </main>
    </div>
    <script type="module" src="job-details.js"></script>
    <script type="module" src="auth-header.js"></script>
</body>
</html>
